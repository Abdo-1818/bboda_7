<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.2/lib/browser/math.js"></script>

<style>
/* مهم جدًا */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; /* 🔥 الحل الحديث للموبايل */
    overflow: hidden;
    background: #000;
}

/* دعم iPhone safe area */
body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* الكالكوليتر */
.calculator {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #111;
}

/* الشاشة */
#display {
    width: 100%;
    height: 22%;
    font-size: 8vw;
    text-align: right;
    padding: 15px;
    border: none;
    background: #000;
    color: white;
}

/* الأزرار */
.keys {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 8px;
}

/* الزرار */
button {
    font-size: 5vw;
    border: none;
    border-radius: 10px;
    background: #2a2a2a;
    color: white;
}

button:active {
    background: #444;
}

.op {
    background: #444;
}

.equal {
    background: blue;
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

<input id="display" disabled>

<div class="keys">

<button onclick="append('9')">9</button>
<button onclick="append('8')">8</button>
<button onclick="append('7')">7</button>
<button class="op" onclick="append('+')">+</button>
<button onclick="clearAll()">C</button>

<button onclick="append('6')">6</button>
<button onclick="append('5')">5</button>
<button onclick="append('4')">4</button>
<button class="op" onclick="append('-')">-</button>
<button onclick="backspace()">⌫</button>

<button onclick="append('3')">3</button>
<button onclick="append('2')">2</button>
<button onclick="append('1')">1</button>
<button class="op" onclick="append('*')">*</button>
<button class="op" onclick="append('/')">/</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button class="op" onclick="append('^')">^</button>

<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('sqrt(')">√</button>
<button onclick="append('log10(')">log</button>

<button onclick="append('log(')">ln</button>
<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>
let display = document.getElementById("display");

math.config({
    number: 'BigNumber',
    precision: 64
});

function append(v) {
    display.value += v;
}

function clearAll() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let result = math.evaluate(display.value);
        display.value = result.toString();
    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
