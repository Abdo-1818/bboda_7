<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>High Precision Scientific Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.2/lib/browser/math.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.calculator {
    width: 720px;
    height: 460px;
    background: #1a1a1a;
    border-radius: 15px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 25px black;
}

#display {
    height: 100px;
    font-size: 30px;
    text-align: right;
    padding: 15px;
    border-radius: 10px;
    border: none;
    background: black;
    color: white;
}

.keys {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    flex: 1;
}

button {
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #2a2a2a;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #3a3a3a;
}

.op {
    background: #444;
}

.equal {
    background: blue;
}
</style>
</head>

<body>

<div class="calculator">

<input id="display" disabled>

<div class="keys">

<!-- أرقام -->
<button onclick="append('9')">9</button>
<button onclick="append('8')">8</button>
<button onclick="append('7')">7</button>
<button class="op" onclick="append('+')">+</button>
<button onclick="clearAll()">C</button>

<button onclick="append('6')">6</button>
<button onclick="append('5')">5</button>
<button onclick="append('4')">4</button>
<button class="op" onclick="append('-')">-</button>
<button onclick="backspace()">⌫</button>

<button onclick="append('3')">3</button>
<button onclick="append('2')">2</button>
<button onclick="append('1')">1</button>
<button class="op" onclick="append('*')">*</button>
<button class="op" onclick="append('/')">/</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button class="op" onclick="append('^')">^</button>

<!-- علمي -->
<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('sqrt(')">√</button>
<button onclick="append('log10(')">log</button>

<button onclick="append('log(')">ln</button>
<button class="equal" onclick="calculate()" style="grid-column: span 4;">=</button>

</div>

</div>

<script>
let display = document.getElementById("display");

// إعداد دقة عالية جدًا
math.config({
    number: 'BigNumber',
    precision: 64
});

function append(v) {
    display.value += v;
}

function clearAll() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let expr = display.value.replace(/\^/g, "^");

        let result = math.evaluate(expr);

        display.value = result.toString();
    } catch {
        display.value = "Math Error";
    }
}
</script>

</body>
</html>
