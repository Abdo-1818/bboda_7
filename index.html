<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.2/lib/browser/math.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0a0a0a;
    font-family: Arial;
    overflow: hidden;
}

/* تملي الشاشة بالكامل */
.calculator {
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
}

/* الشاشة */
#display {
    width: 100%;
    height: 20%;
    font-size: 6vw;
    text-align: right;
    padding: 20px;
    border: none;
    background: black;
    color: white;
}

/* الأزرار */
.keys {
    width: 100%;
    height: 80%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px;
}

/* زرار متجاوب */
button {
    font-size: 4vw;
    border: none;
    border-radius: 10px;
    background: #2a2a2a;
    color: white;
    cursor: pointer;
}

button:active {
    background: #444;
}

/* العمليات */
.op {
    background: #444;
}

.equal {
    background: blue;
    grid-column: span 2;
}

/* تكبير في التابلت */
@media (min-width: 768px) {
    button {
        font-size: 2.5vw;
    }
    #display {
        font-size: 4vw;
    }
}
</style>
</head>

<body>

<div class="calculator">

<input id="display" disabled>

<div class="keys">

<!-- أرقام -->
<button onclick="append('9')">9</button>
<button onclick="append('8')">8</button>
<button onclick="append('7')">7</button>
<button class="op" onclick="append('+')">+</button>
<button onclick="clearAll()">C</button>

<button onclick="append('6')">6</button>
<button onclick="append('5')">5</button>
<button onclick="append('4')">4</button>
<button class="op" onclick="append('-')">-</button>
<button onclick="backspace()">⌫</button>

<button onclick="append('3')">3</button>
<button onclick="append('2')">2</button>
<button onclick="append('1')">1</button>
<button class="op" onclick="append('*')">*</button>
<button class="op" onclick="append('/')">/</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button class="op" onclick="append('^')">^</button>

<!-- علمي -->
<button onclick="append('sin(')">sin</button>
<button onclick="append('cos(')">cos</button>
<button onclick="append('tan(')">tan</button>
<button onclick="append('sqrt(')">√</button>
<button onclick="append('log10(')">log</button>

<button onclick="append('log(')">ln</button>
<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>
let display = document.getElementById("display");

math.config({
    number: 'BigNumber',
    precision: 64
});

function append(v) {
    display.value += v;
}

function clearAll() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let expr = display.value.replace(/\^/g, "^");
        let result = math.evaluate(expr);
        display.value = result.toString();
    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
